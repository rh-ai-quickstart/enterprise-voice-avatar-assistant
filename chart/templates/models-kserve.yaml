{{- /*
One vLLM ServingRuntime plus InferenceService per model with deploy=true.
Shape follows what the OpenShift AI 3.5 dashboard creates (Standard deployment
mode, modelcar or Hugging Face storageUri, port 8080).
*/ -}}
{{- range $key := list "llm" "stt" "embeddings" "guardrails" }}
{{- $m := index $.Values.models $key }}
{{- if $m.deploy }}
{{- $template := "" }}
{{- if $m.chatTemplateFile }}
{{- $template = $.Files.Get $m.chatTemplateFile }}
{{- if not $template }}{{ fail (printf "models.%s.chatTemplateFile %s not found in the chart" $key $m.chatTemplateFile) }}{{ end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $m.name }}-chat-template
  labels:
    {{- include "assistant.componentLabels" (dict "root" $ "name" (printf "model-%s" $key)) | nindent 4 }}
data:
  chat_template.jinja: |-
{{ $template | indent 4 }}
{{- end }}
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: {{ $m.name }}
  labels:
    opendatahub.io/dashboard: "true"
    {{- include "assistant.componentLabels" (dict "root" $ "name" (printf "model-%s" $key)) | nindent 4 }}
  annotations:
    opendatahub.io/apiProtocol: REST
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    openshift.io/display-name: vLLM runtime for {{ $m.displayName }}
spec:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  containers:
    - name: kserve-container
      image: {{ default $.Values.models.runtimeImage $m.runtimeImage }}
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - --port=8080
        - --model=/mnt/models
        - --served-model-name={{ $m.servedModelName }}
      env:
        - name: HF_HOME
          value: /tmp/hf_home
      ports:
        - containerPort: 8080
          protocol: TCP
  multiModel: false
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: {{ $m.name }}
  labels:
    opendatahub.io/dashboard: "true"
    {{- include "assistant.componentLabels" (dict "root" $ "name" (printf "model-%s" $key)) | nindent 4 }}
  annotations:
    openshift.io/display-name: {{ $m.displayName }}
    {{- if $template }}
    checksum/chat-template: {{ $template | sha256sum | trunc 16 }}
    {{- end }}
    serving.kserve.io/deploymentMode: Standard
    serving.kserve.io/autoscalerClass: external
    security.opendatahub.io/enable-auth: "false"
    # Applied after the application's other resources and hooks; the sync operation does not
    # wait for the models to be Ready (weights download and GPU start-up can take long)
    argocd.argoproj.io/sync-wave: "1"
spec:
  predictor:
    {{- with $.Values.models.podLabels }}
    labels:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    automountServiceAccountToken: false
    {{- include "assistant.affinity" $ | nindent 4 }}
    minReplicas: 1
    maxReplicas: 1
    # GPU-bound single replica: a rolling update would need a second GPU while
    # the old pod still holds the first. Recreate stops the old pod first.
    deploymentStrategy:
      type: Recreate
    model:
      modelFormat:
        name: vLLM
      runtime: {{ $m.name }}
      storageUri: {{ $m.storageUri | quote }}
      {{- if or $m.args $template }}
      args:
        {{- range $m.args }}
        - {{ . | quote }}
        {{- end }}
        {{- if $template }}
        - --chat-template=/mnt/chat-template/chat_template.jinja
        {{- end }}
      {{- end }}
      {{- if $template }}
      volumeMounts:
        - name: chat-template
          mountPath: /mnt/chat-template
          readOnly: true
      {{- end }}
      resources:
        {{- toYaml $m.resources | nindent 8 }}
    {{- if $template }}
    volumes:
      - name: chat-template
        configMap:
          name: {{ $m.name }}-chat-template
    {{- end }}
{{- end }}
{{- end }}
