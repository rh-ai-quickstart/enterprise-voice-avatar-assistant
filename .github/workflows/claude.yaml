name: Claude

# "@claude" in a pull request comment, a review, a review comment or a new issue asks Claude Code
# to answer there: review the changes ("@claude review this PR"), explain code, or push a fix to
# the pull request's branch. It reads CLAUDE.md for the project's rules and checks.
#
# Only people with write access can trigger it: the action checks, and the author_association
# filter below keeps the job from starting at all for anyone else, since this repository is public.
# It needs one repository secret, ANTHROPIC_API_KEY (Claude Console) or CLAUDE_CODE_OAUTH_TOKEN
# (`claude setup-token` with a Pro or Max plan); see docs/development.md. It runs with this
# workflow's GITHUB_TOKEN, so no GitHub App is installed and comments come from github-actions[bot].

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  claude:
    name: Claude
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push a fix to the pull request's branch when asked
      pull-requests: write # comment and review
      issues: write
      actions: read # read a pull request's CI results
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          # whichever of the two secrets exists
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
