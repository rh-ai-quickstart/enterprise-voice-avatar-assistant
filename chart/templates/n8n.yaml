{{- if .Values.n8n.enabled }}
{{- $host := include "assistant.publicHost" (dict "root" . "name" "n8n" "override" .Values.n8n.publicHost) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "n8n") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.global.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.n8n.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "n8n") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "assistant.selector" (dict "root" . "name" "n8n") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/workflows: {{ (.Files.Glob "files/n8n-workflows/*.json").AsConfig | sha256sum | trunc 16 }}
      labels:
        {{- include "assistant.componentLabels" (dict "root" . "name" "n8n") | nindent 8 }}
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      {{- if .Values.n8n.workflows.autoImport }}
      # Imports the shipped workflows (and the Slack credential when a bot token is in the
      # integrations secret) and publishes them before the server starts, so a fresh install
      # comes up with the workflows active. Guarded by a marker on the data volume.
      initContainers:
        - name: import-workflows
          image: {{ .Values.n8n.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- include "assistant.securityContext" . | nindent 12 }}
          env:
            {{- include "assistant.n8nEnv" . | nindent 12 }}
            - name: IMPORT_POLICY
              value: {{ .Values.n8n.workflows.importPolicy | quote }}
            - name: SLACK_CREDENTIAL_ID
              value: {{ .Values.n8n.workflows.slackCredentialId | quote }}
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.integrations }}
                  key: SLACK_BOT_TOKEN
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: workflows
              mountPath: /workflows
              readOnly: true
          command:
            - /bin/sh
            - -c
            - |
              set -u
              MARK=/data/.workflows-imported
              HASH=$(cat /workflows/*.json | sha256sum | cut -c1-16)
              case "$IMPORT_POLICY" in
                once)     [ -f "$MARK" ] && { echo "workflows already imported (marker $(cat "$MARK")); importPolicy=once, skipping"; exit 0; } ;;
                onChange) [ "$(cat "$MARK" 2>/dev/null)" = "$HASH" ] && { echo "workflows unchanged ($HASH), skipping"; exit 0; } ;;
                always)   ;;
                *)        echo "unknown importPolicy $IMPORT_POLICY"; exit 1 ;;
              esac
              for i in $(seq 1 60); do
                node -e "require('net').connect($DB_POSTGRESDB_PORT,'$DB_POSTGRESDB_HOST').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))" && break
                echo "waiting for postgres"; sleep 5
              done
              if [ -n "${SLACK_BOT_TOKEN:-}" ]; then
                node -e 'const fs=require("fs");fs.writeFileSync("/tmp/credentials.json",JSON.stringify([{id:process.env.SLACK_CREDENTIAL_ID,name:"Slack account",type:"slackApi",data:{accessToken:process.env.SLACK_BOT_TOKEN}}]))'
                n8n import:credentials --input=/tmp/credentials.json && echo "Slack credential imported as $SLACK_CREDENTIAL_ID"
                rm -f /tmp/credentials.json
              elif n8n export:credentials --id="$SLACK_CREDENTIAL_ID" --output=/tmp/existing.json >/dev/null 2>&1 && [ -s /tmp/existing.json ]; then
                echo "no SLACK_BOT_TOKEN in the integrations secret; keeping the Slack credential $SLACK_CREDENTIAL_ID already in n8n"
              else
                # Without a credential of the Slack nodes' type the workflows would not be published, and
                # ingestion, approvals and archival need them with Slack off too. A placeholder stands in;
                # the Slack nodes sit behind "Slack on?" and do not run while SLACK_ENABLED is false.
                node -e 'const fs=require("fs");fs.writeFileSync("/tmp/credentials.json",JSON.stringify([{id:process.env.SLACK_CREDENTIAL_ID,name:"Slack account",type:"slackApi",data:{accessToken:"not-configured"}}]))'
                n8n import:credentials --input=/tmp/credentials.json && echo "no SLACK_BOT_TOKEN in the integrations secret; placeholder Slack credential $SLACK_CREDENTIAL_ID imported so the workflows publish"
                rm -f /tmp/credentials.json
              fi
              rm -f /tmp/existing.json
              n8n import:workflow --separate --input=/workflows || exit 1
              # Publish only workflows whose credential types exist; the CLI would publish
              # regardless, and the editor then fails to save them until a credential is attached.
              n8n export:credentials --all --output=/tmp/creds.json >/dev/null 2>&1 || echo "[]" > /tmp/creds.json
              for f in /workflows/*.json; do
                id=$(node -e "console.log(require('$f').id)")
                name=$(node -e "console.log(require('$f').name)")
                missing=$(node -e '
                  const wf = require(process.argv[1]);
                  const have = new Set(require("/tmp/creds.json").map(c => c.type));
                  const byNode = { "n8n-nodes-base.slack": "slackApi", "n8n-nodes-base.googleDocs": "googleDocsOAuth2Api", "n8n-nodes-base.googleDrive": "googleDriveOAuth2Api", "n8n-nodes-base.googleSheets": "googleSheetsOAuth2Api" };
                  const need = new Set();
                  for (const n of wf.nodes) { for (const t of Object.keys(n.credentials || {})) need.add(t); if (byNode[n.type]) need.add(byNode[n.type]); }
                  console.log([...need].filter(t => !have.has(t)).join(","));' "$f")
                if [ -n "$missing" ]; then echo "not published $name: add a credential of type $missing in n8n, then publish it"; continue; fi
                if n8n publish:workflow --id="$id" >/tmp/publish.log 2>&1; then echo "published  $name"; else echo "not published $name: $(tail -1 /tmp/publish.log | cut -c1-160)"; fi
              done
              rm -f /tmp/creds.json
              echo "$HASH" > "$MARK"
      {{- end }}
      containers:
        - name: n8n
          image: {{ .Values.n8n.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # Integration settings such as GOOGLE_DOCS_FOLDER_ID come from the secret created by
          # scripts/create-secrets.sh; explicit env entries below (extraEnv) win over it.
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.integrations }}
                optional: true
          env:
            {{- include "assistant.n8nEnv" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 5678
              protocol: TCP
          # First start runs database migrations; the startup probe gives it up to 5 minutes.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.n8n.resources | nindent 12 }}
          securityContext:
            {{- include "assistant.securityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
        {{- if .Values.n8n.workflows.autoImport }}
        - name: workflows
          configMap:
            name: n8n-workflows
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "n8n") | nindent 4 }}
spec:
  selector:
    {{- include "assistant.selector" (dict "root" . "name" "n8n") | nindent 4 }}
  ports:
    - name: http
      port: 5678
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: n8n
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "n8n") | nindent 4 }}
  annotations:
    haproxy.router.openshift.io/timeout: 120s
spec:
  {{- if $host }}
  host: {{ $host }}
  {{- end }}
  to:
    kind: Service
    name: n8n
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
