# Values for the demo cluster: a Red Hat Demo Platform "Red Hat OpenShift AI 3" environment,
# single-node OpenShift 4.20 on one AWS g6 instance with a single NVIDIA L4 (24 GB), with a
# Llama 3.2 3B Instruct model already deployed as llama-32-3b-instruct. SETUP.md walks
# through the whole setup. Nothing cluster-specific is stored here: scripts/deploy-argocd.sh
# passes the apps domain and the endpoint of the deployed model to the Argo CD application
# from the cluster it is logged in to, so this file works unchanged on the next cluster.
#
# Application images are built by .github/workflows/build-images.yaml and pushed to
# quay.io/rh-ai-quickstart. The workflow rewrites the per-service image references below
# after every successful build (pinned by commit).
images:
  registry: quay.io/rh-ai-quickstart

voiceAgent:
  enabled: true
  # Tavus renders the avatar from the agent audio. TAVUS_API_KEY (and optionally
  # TAVUS_FACE_ID) come from the assistant-integrations secret (scripts/create-secrets.sh).
  avatarProvider: tavus
  # Faces offered in the UI (Tavus stock faces; scripts/list-tavus-faces.sh lists them).
  # The voice follows the declared gender through models.tts.voices; the first entry is the default.
  faces:
    - id: r67d1c9cac37
      name: Jackie
      gender: female
    - id: re6220ec0195
      name: Raj
      gender: male
    - id: r873e4707689
      name: James
      gender: male
    - id: rf6b1c8d5e9d
      name: Samantha
      gender: female
  image: quay.io/rh-ai-quickstart/enterprise-voice-avatar-assistant-voice-agent:sha-988df7c
frontend:
  enabled: true
  image: quay.io/rh-ai-quickstart/enterprise-voice-avatar-assistant-frontend:sha-988df7c
ragApi:
  enabled: true
  image: quay.io/rh-ai-quickstart/enterprise-voice-avatar-assistant-rag-api:sha-988df7c
ingestion:
  enabled: true
  image: quay.io/rh-ai-quickstart/enterprise-voice-avatar-assistant-ingestion:sha-988df7c

# The language model is the Llama 3.2 3B Instruct already served on the cluster
# (llama-32-3b-instruct, a prerequisite in SETUP.md). scripts/deploy-argocd.sh finds it and
# sets models.llm.endpoint and models.llm.servedModelName on the Argo CD application; the
# values below are placeholders that keep the chart renderable on its own.
# Whisper and BGE-M3 share the single L4 with that model through GPU time-slicing
# (scripts/bootstrap-cluster.sh, GPU_SLICES=4) and fixed memory shares; the bootstrap
# script lowers the deployed model's share to LLM_GPU_FRACTION (0.55) so all three fit.
# Granite Guardian does not fit as well, so the guardrail provider is off on this cluster.
models:
  llm:
    deploy: false
    servedModelName: llama-32-3b-instruct
    endpoint: http://llama-32-3b-instruct-predictor.CLUSTER-PROJECT.svc.cluster.local:8080/v1
  stt:
    deploy: true
    args:
      - --gpu-memory-utilization=0.15
      - --max-num-seqs=8
      - --enforce-eager
  embeddings:
    args:
      - --runner=pooling
      - --max-model-len=8192
      - --gpu-memory-utilization=0.12
      - --max-num-seqs=8
      - --enforce-eager
  guardrails:
    provider: none
    deploy: false
  tts:
    # Bright female Kokoro voice for the default face (af_bella, grade A-; af_heart is warmer).
    voice: af_bella
    # Kokoro runs on CPU; the node has 32 vCPU, and more cores shorten the first sentence.
    resources:
      requests:
        cpu: "2"
        memory: 2Gi
      limits:
        cpu: "8"
        memory: 4Gi

# Qdrant dashboard for the demo (protected by the API key from assistant-qdrant).
qdrant:
  apiKeySecret: assistant-qdrant
  route: true

livekit:
  turn:
    # TURN over TLS behind a passthrough Route, needed for browsers behind corporate
    # networks. The certificate secret is created by scripts/setup-turn-tls.sh (a copy of
    # the cluster's wildcard certificate, or one issued by cert-manager).
    enabled: true
    tlsSecret: livekit-turn-tls
