apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-services
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "test") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  enableServiceLinks: false
  restartPolicy: Never
  containers:
    - name: test
      image: registry.access.redhat.com/ubi9/ubi-minimal:latest
      securityContext:
        {{- include "assistant.securityContext" . | nindent 8 }}
      env:
        - name: LLM_BASE_URL
          value: {{ include "assistant.modelEndpoint" (dict "root" . "key" "llm") | quote }}
        - name: LLM_MODEL
          value: {{ .Values.models.llm.servedModelName | quote }}
        - name: LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.models }}
              key: LLM_API_KEY
        - name: STT_BASE_URL
          value: {{ include "assistant.modelEndpoint" (dict "root" . "key" "stt") | quote }}
        - name: EMBEDDINGS_BASE_URL
          value: {{ include "assistant.modelEndpoint" (dict "root" . "key" "embeddings") | quote }}
        - name: EMBEDDINGS_MODEL
          value: {{ .Values.models.embeddings.servedModelName | quote }}
        - name: EMBEDDINGS_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.secrets.models }}
              key: EMBEDDINGS_API_KEY
        {{- if ne .Values.models.guardrails.provider "none" }}
        - name: GUARDRAILS_BASE_URL
          value: {{ include "assistant.modelEndpoint" (dict "root" . "key" "guardrails") | quote }}
        {{- end }}
        - name: CA
          value: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
      command:
        - /bin/sh
        - -c
        - |
          set -u
          failed=0
          check() {
            name="$1"; url="$2"
            if curl -sf --max-time 20 --cacert "$CA" "$url" >/dev/null; then echo "OK      $name"; else echo "FAILED  $name ($url)"; failed=1; fi
          }
          [ -n "$STT_BASE_URL" ] && check stt-models "$STT_BASE_URL/models"
          [ -n "$EMBEDDINGS_BASE_URL" ] && check embeddings-models "$EMBEDDINGS_BASE_URL/models"
          [ -n "${GUARDRAILS_BASE_URL:-}" ] && check guardrails-models "$GUARDRAILS_BASE_URL/models"
          if [ -n "$EMBEDDINGS_BASE_URL" ]; then
            if curl -sf --max-time 60 --cacert "$CA" -H "Authorization: Bearer $EMBEDDINGS_API_KEY" -H "Content-Type: application/json" \
              -d "{\"model\": \"$EMBEDDINGS_MODEL\", \"input\": \"hello\"}" "$EMBEDDINGS_BASE_URL/embeddings" >/dev/null; then echo "OK      embeddings ($EMBEDDINGS_MODEL)"; else echo "FAILED  embeddings ($EMBEDDINGS_BASE_URL, model $EMBEDDINGS_MODEL)"; failed=1; fi
          fi
          {{- if .Values.qdrant.enabled }}
          check qdrant http://qdrant:6333/readyz
          {{- end }}
          {{- if .Values.objectStore.enabled }}
          check object-store http://object-store:7070/health
          {{- end }}
          {{- if .Values.n8n.enabled }}
          check n8n http://n8n:5678/healthz
          {{- end }}
          {{- if .Values.livekit.enabled }}
          check livekit http://livekit:7880/
          {{- end }}
          {{- if .Values.ragApi.enabled }}
          check rag-api http://rag-api:8080/healthz
          {{- end }}
          {{- if .Values.ingestion.enabled }}
          check ingestion http://ingestion:8080/healthz
          {{- end }}
          {{- if .Values.models.tts.deploy }}
          check tts http://tts:8880/v1/models
          {{- end }}
          if [ -n "$LLM_BASE_URL" ]; then
            if curl -sf --max-time 60 --cacert "$CA" -H "Authorization: Bearer $LLM_API_KEY" -H "Content-Type: application/json" \
              -d "{\"model\": \"$LLM_MODEL\", \"messages\": [{\"role\": \"user\", \"content\": \"Say hello in one word.\"}], \"max_tokens\": 10}" \
              "$LLM_BASE_URL/chat/completions" >/dev/null; then echo "OK      llm chat completion"; else echo "FAILED  llm chat completion ($LLM_BASE_URL)"; failed=1; fi
          fi
          exit $failed
