{{- if .Values.frontend.enabled }}
{{- $host := include "assistant.publicHost" (dict "root" . "name" "frontend" "override" .Values.frontend.publicHost) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      {{- include "assistant.selector" (dict "root" . "name" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "assistant.componentLabels" (dict "root" . "name" "frontend") | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: frontend
          image: {{ include "assistant.image" (dict "root" . "name" "frontend" "override" .Values.frontend.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: RAG_API_UPSTREAM
              value: rag-api:8080
            # false: the proxy refuses /api/v1/admin/* like every other internal route
            - name: ADMIN_ENABLED
              value: {{ .Values.admin.enabled | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- include "assistant.securityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "frontend") | nindent 4 }}
spec:
  selector:
    {{- include "assistant.selector" (dict "root" . "name" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if .Values.frontend.route }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: frontend
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "frontend") | nindent 4 }}
  {{- if .Values.admin.enabled }}
  annotations:
    # The admin portal's event stream is one long response (a comment every 15 s keeps it alive)
    haproxy.router.openshift.io/timeout: 1h
  {{- end }}
spec:
  {{- if $host }}
  host: {{ $host }}
  {{- end }}
  to:
    kind: Service
    name: frontend
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
{{- end }}
