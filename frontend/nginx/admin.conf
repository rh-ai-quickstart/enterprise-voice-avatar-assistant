# Admin portal locations, included in the default server block next to app.conf. The entrypoint
# replaces this file with a 404 for /admin when ADMIN_ENABLED=false.

# The portal is a single-page app of its own: its routes (/admin/tickets/REQ-000001) load
# admin/index.html, which is never cached so a new build shows up on reload.
location = /admin {
    # relative: behind the router's TLS, nginx's own scheme and port would be wrong
    absolute_redirect off;
    return 301 /admin/;
}
location /admin/ {
    try_files $uri /admin/index.html;
}
location = /admin/index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

# Server-sent events for the portal's live updates: passed on as they come, open for up to an hour
# (the frontend Route allows the same).
location = /api/v1/admin/stream {
    if ($api_public = 0) {
        return 404 '{"detail":"Not Found"}';
    }
    proxy_pass http://__RAG_API_UPSTREAM__/v1/admin/stream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Client-Address $client_address;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
}
