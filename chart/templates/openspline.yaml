{{- if has "openspline" (include "assistant.avatarProviders" . | fromJsonArray) }}
{{- $o := .Values.openspline }}
{{- /* without an image of its own, the stock Python image runs the install kept on the volume */}}
{{- $bin := ternary "openspline" "/data/openspline/venv/bin/openspline" (not (empty $o.image)) }}
{{- $python := ternary "python" "/data/openspline/venv/bin/python" (not (empty $o.image)) }}
{{- /* workers: one per GPU (low) or per GPU pair (high), from the GPUs in resources */}}
{{- $gpus := 1 }}
{{- range $k, $v := (dig "limits" (dict) $o.resources) }}{{ if hasPrefix "nvidia.com/" $k }}{{ $gpus = int $v }}{{ end }}{{ end }}
{{- $high := eq $o.quality "high" }}
{{- $workers := div $gpus (ternary 2 1 $high) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: openspline-workers
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "openspline") | nindent 4 }}
data:
  # OpenSpline's worker layout: each worker serves one voice session at a time
  workers.yaml: |
    workers:
    {{- range $i := until (int $workers) }}
      - id: gpu-{{ $i }}
        quality: {{ $o.quality }}
        devices: {{ if $high }}[{{ mul $i 2 }}, {{ add (mul $i 2) 1 }}]{{ else }}[{{ $i }}]{{ end }}
    {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: avatar-portraits
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "openspline") | nindent 4 }}
# The faces' portraits (chart/files/portraits), mounted at /portraits in the voice agent and the RAG API
binaryData:
  {{- range $path, $_ := .Files.Glob "files/portraits/*.jpg" }}
  {{ base $path }}: {{ $.Files.Get $path | b64enc }}
  {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openspline-data
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "openspline") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.global.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ $o.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openspline
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "openspline") | nindent 4 }}
spec:
  replicas: 1
  # the GPU and the volume are released before the next pod starts
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "assistant.selector" (dict "root" . "name" "openspline") | nindent 6 }}
  template:
    metadata:
      annotations:
        # a new worker layout (quality, GPUs) restarts the server
        checksum/workers: {{ printf "%s/%d" $o.quality $gpus | sha256sum | trunc 16 }}
      labels:
        {{- include "assistant.componentLabels" (dict "root" . "name" "openspline") | nindent 8 }}
        {{- with $o.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      enableServiceLinks: false
      {{- include "assistant.affinity" $ | nindent 6 }}
      initContainers:
        {{- if not $o.image }}
        # First start only: the steps of OpenSpline's install.sh, pinned to one commit, into a
        # virtual environment on the volume (PyTorch with CUDA and the server, a few GB)
        - name: install
          image: {{ $o.baseImage }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/bash", "-euc"]
          args:
            - |
              dir=/data/openspline
              if [ -f "$dir/installed-$REF" ]; then echo "OpenSpline $REF already installed"; exit 0; fi
              echo "installing OpenSpline $REF (first start only)"
              rm -rf "$dir" "$UV_CACHE_DIR" && mkdir -p "$dir/src"
              curl -fsSL --retry 3 "https://github.com/openspline/openspline/archive/$REF.tar.gz" | tar -xz --strip-components=1 -C "$dir/src"
              python3.11 -m venv /tmp/tools && /tmp/tools/bin/pip install --quiet --no-cache-dir "uv==$UV_VERSION"
              uv=/tmp/tools/bin/uv
              cd "$dir/src"
              $uv venv --python python3.11 "$dir/venv"
              $uv pip install --python "$dir/venv/bin/python" --no-deps --require-hashes -r requirements/server.txt
              $uv pip install --python "$dir/venv/bin/python" --torch-backend cu126 --require-hashes -r requirements/server.txt -r requirements/cu126.txt
              $uv pip install --python "$dir/venv/bin/python" --no-deps ./packages/server ./packages/python
              cd / && rm -rf "$dir/src" "$UV_CACHE_DIR"
              touch "$dir/installed-$REF"
              echo "OpenSpline $REF installed"
          env:
            - name: REF
              value: {{ $o.ref | quote }}
            - name: UV_VERSION
              value: {{ $o.uvVersion | quote }}
            - name: HOME
              value: /tmp
            # on the volume, so the environment hard-links the downloaded packages instead of copying
            - name: UV_CACHE_DIR
              value: /data/.uv-cache
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            {{- include "assistant.securityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
        {{- end }}
        # First start (and a change of quality): the SoulX-FlashHead and wav2vec2 weights from
        # Hugging Face, at the revisions OpenSpline pins
        - name: models
          image: {{ $o.image | default $o.baseImage }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/bash", "-euc"]
          args:
            - |
              if [ -f "/data/models/ready-$QUALITY" ]; then echo "models for $QUALITY quality present"; exit 0; fi
              {{ $bin }} models --directory /data/models --quality "$QUALITY"
              touch "/data/models/ready-$QUALITY"
          env:
            - name: QUALITY
              value: {{ $o.quality | quote }}
            - name: HOME
              value: /tmp
            - name: HF_HOME
              value: /data/.hf
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            {{- include "assistant.securityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      containers:
        - name: openspline
          image: {{ $o.image | default $o.baseImage }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          # OpenSpline publishes with LiveKit's defaults: 300 kbps for 512 x 512 video, which smears
          # busy backgrounds, and no track source. The patch gives the video OPENSPLINE_VIDEO_BITRATE,
          # with simulcast as OPENSPLINE_VIDEO_SIMULCAST says, and marks the tracks as camera and
          # microphone. It runs on every start; the values are read when the worker publishes, so it
          # changes nothing once applied. A file patched by an earlier chart, with simulcast fixed
          # off, is updated.
          # A second patch puts the face back in the portrait's pose after each answer when
          # OPENSPLINE_RESET_POSE_EACH_ANSWER is true. OpenSpline keeps the face's motion from one
          # answer to the next, even across an interruption, so a new answer began from a face
          # caught mid-word and the lips trailed the voice. When an answer ends or is interrupted,
          # the worker is prepared again with the portrait (as when a session starts) while the
          # session's inference loop is idle, so the next answer does not wait for it (about 0.2 s);
          # if that answer's audio comes first, the reset runs before it. A failed reset is logged
          # and the pose kept. The log prints how long each reset took.
          command: ["/bin/bash", "-euc"]
          args:
            - |
              {{ $python }} - <<'PY'
              import importlib.util, pathlib
              path = pathlib.Path(importlib.util.find_spec("openspline_server.livekit").origin)
              text = path.read_text()
              old_audio = 'rtc.LocalAudioTrack.create_audio_track("avatar_audio", self.audio)\n'
              old_video = 'rtc.LocalVideoTrack.create_video_track("avatar_video", self.video)\n'
              simulcast = "simulcast=__import__('os').environ.get('OPENSPLINE_VIDEO_SIMULCAST') == 'true',"
              if "SOURCE_CAMERA, simulcast=False," in text:
                  path.write_text(text.replace("SOURCE_CAMERA, simulcast=False,", "SOURCE_CAMERA, " + simulcast))
                  print("publish options updated: simulcast from OPENSPLINE_VIDEO_SIMULCAST")
              elif "SOURCE_CAMERA" in text:
                  print("publish options already patched")
              elif old_audio in text and old_video in text:
                  text = text.replace(old_audio, old_audio[:-1] + ",\n            rtc.TrackPublishOptions(source=rtc.TrackSource.SOURCE_MICROPHONE),\n")
                  text = text.replace(old_video, old_video[:-1] + (
                      ",\n            rtc.TrackPublishOptions(source=rtc.TrackSource.SOURCE_CAMERA, " + simulcast +
                      " video_encoding=rtc.VideoEncoding(max_bitrate=int(__import__('os').environ['OPENSPLINE_VIDEO_BITRATE']),"
                      " max_framerate=25)),\n"))
                  path.write_text(text)
                  print("publish options patched")
              else:
                  print("WARNING: publish_track calls not found; video keeps LiveKit's default bitrate")
              path = pathlib.Path(importlib.util.find_spec("openspline_server.session").origin)
              text = path.read_text()
              enabled = '__import__("os").environ.get("OPENSPLINE_RESET_POSE_EACH_ANSWER") == "true"'
              anchors = {
                  "method": "    async def interrupt(self):\n",
                  "interrupted": '        self.emit({"type": "interrupted"})\n',
                  "turn_end": '                        self.emit({"type": "turn_end", "target_samples": self.timeline.submitted})\n',
                  "idle": "                except asyncio.TimeoutError:\n                    await self._idle()\n",
                  "first_audio": "                        if self.converter is None:\n                            self.converter = (\n",
              }
              reset = (
                  "    async def _reset_pose(self):\n"
                  "        # chart patch: back to the portrait's pose after each answer, before the next one\n"
                  "        self._pose_due = False\n"
                  "        started = time.monotonic()\n"
                  "        try:\n"
                  "            await self.worker.call(\"prepare\", str(self.image), 0)\n"
                  "        except Exception as exc:\n"
                  "            print(f\"[pose] reset failed, keeping the current pose: {type(exc).__name__}\", flush=True)\n"
                  "            return\n"
                  "        self.history.fill(0)\n"
                  "        self.timeline.clear_idle()\n"
                  "        self.timeline.frame = self.timeline.portrait\n"
                  "        print(f\"[pose] reset to the portrait in {time.monotonic() - started:.3f}s\", flush=True)\n\n"
              )
              due = "self._pose_due = " + enabled
              markers = ("async def _reset_pose", due, 'getattr(self, "_pose_due", False)')
              if all(m in text for m in markers):
                  print("pose reset already patched")
              elif any(m in text for m in markers):
                  print("WARNING: pose reset partly patched; answers keep the previous pose")
              elif all(text.count(a) == 1 for a in anchors.values()):
                  text = text.replace(anchors["method"], reset + anchors["method"])
                  text = text.replace(anchors["interrupted"], anchors["interrupted"] + "        " + due + "\n")
                  text = text.replace(anchors["turn_end"], anchors["turn_end"] + "                        " + due + "\n")
                  text = text.replace(anchors["idle"], (
                      "                except asyncio.TimeoutError:\n"
                      "                    if getattr(self, \"_pose_due\", False):\n"
                      "                        await self._reset_pose()\n"
                      "                        continue\n"
                      "                    await self._idle()\n"))
                  text = text.replace(anchors["first_audio"], (
                      "                        if self.converter is None:\n"
                      "                            if getattr(self, \"_pose_due\", False):\n"
                      "                                await self._reset_pose()\n"
                      "                            self.converter = (\n"))
                  path.write_text(text)
                  print("pose reset patched")
              else:
                  print("WARNING: session code not as expected; answers keep the previous pose")
              PY
              exec {{ $bin }} serve --config /config/workers.yaml --host 0.0.0.0 --port 7860
          env:
            - name: OPENSPLINE_VIDEO_BITRATE
              value: {{ $o.videoBitrate | int64 | quote }}
            - name: OPENSPLINE_VIDEO_SIMULCAST
              value: {{ $o.simulcast | toString | quote }}
            - name: OPENSPLINE_RESET_POSE_EACH_ANSWER
              value: {{ $o.resetPoseEachAnswer | toString | quote }}
            - name: HOME
              value: /tmp
            - name: HF_HOME
              value: /data/.hf
            - name: OPENSPLINE_MODEL_DIR
              value: /data/models/avatar
            - name: OPENSPLINE_AUDIO_MODEL_DIR
              value: /data/models/audio
            - name: OPENSPLINE_RUNTIME_DIR
              value: /tmp/runtime
          ports:
            - name: http
              containerPort: 7860
              protocol: TCP
          # the server listens once its GPU worker has loaded the model (a minute or two)
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 90
          # 503 while the worker is not loaded (it reloads after a failure)
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml $o.resources | nindent 12 }}
          securityContext:
            {{- include "assistant.securityContext" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
            - name: workers
              mountPath: /config
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: openspline-data
        - name: tmp
          emptyDir: {}
        # high quality runs one process per GPU of the pair, which exchange tensors through it
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ ternary "8Gi" "2Gi" $high }}
        - name: workers
          configMap:
            name: openspline-workers
---
apiVersion: v1
kind: Service
metadata:
  name: openspline
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "openspline") | nindent 4 }}
spec:
  selector:
    {{- include "assistant.selector" (dict "root" . "name" "openspline") | nindent 4 }}
  ports:
    - name: http
      port: 7860
      targetPort: http
{{- end }}
