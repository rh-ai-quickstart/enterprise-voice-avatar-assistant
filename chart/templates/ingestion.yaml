{{- if .Values.ingestion.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "ingestion") | nindent 4 }}
spec:
  replicas: {{ .Values.ingestion.replicas }}
  selector:
    matchLabels:
      {{- include "assistant.selector" (dict "root" . "name" "ingestion") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "assistant.componentLabels" (dict "root" . "name" "ingestion") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | trunc 16 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: ingestion
          image: {{ include "assistant.image" (dict "root" . "name" "ingestion" "override" .Values.ingestion.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: assistant-config
            - secretRef:
                name: {{ .Values.secrets.postgres }}
            - secretRef:
                name: {{ .Values.secrets.models }}
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.minio }}
                  key: MINIO_ROOT_USER
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.minio }}
                  key: MINIO_ROOT_PASSWORD
            {{- if .Values.qdrant.apiKeySecret }}
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.qdrant.apiKeySecret }}
                  key: QDRANT_API_KEY
            {{- end }}
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.admin }}
                  key: INTERNAL_API_TOKEN
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            {{- toYaml .Values.ingestion.resources | nindent 12 }}
          securityContext:
            {{- include "assistant.securityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ingestion
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "ingestion") | nindent 4 }}
spec:
  selector:
    {{- include "assistant.selector" (dict "root" . "name" "ingestion") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
