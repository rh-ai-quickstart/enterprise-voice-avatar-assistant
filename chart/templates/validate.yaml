{{- /*
Fails the install early with an actionable message instead of producing pods that
cannot reach a model. Renders nothing.
*/ -}}
{{- range $key := list "llm" "stt" "embeddings" "tts" }}
{{- $m := index $.Values.models $key }}
{{- if not $m.deploy }}
{{- if not $m.endpoint }}
{{- fail (printf "models.%s.deploy is false but models.%s.endpoint is empty. Set the OpenAI-compatible base URL including /v1, for example: --set models.%s.endpoint=https://host/v1" $key $key $key) }}
{{- end }}
{{- if not $m.servedModelName }}
{{- fail (printf "models.%s.servedModelName is empty. Set it to the model name the endpoint serves (GET <endpoint>/models lists them): --set models.%s.servedModelName=<name>" $key $key) }}
{{- end }}
{{- end }}
{{- end }}
{{- $g := .Values.models.guardrails }}
{{- if and (ne $g.provider "none") (ne $g.provider "trustyai") (not $g.deploy) (not $g.endpoint) }}
{{- fail (printf "models.guardrails.provider is %s with deploy false but models.guardrails.endpoint is empty; set the endpoint or deploy the model" $g.provider) }}
{{- end }}
{{- range $key := list "faces" "beyFaces" }}
{{- $list := index $.Values.voiceAgent $key | default list }}
{{- if gt (len $list) 4 }}
{{- fail (printf "voiceAgent.%s lists %d faces; the UI offers at most 4" $key (len $list)) }}
{{- end }}
{{- range $f := $list }}
{{- if not $f.id }}
{{- fail (printf "voiceAgent.%s: every entry needs an id (the Tavus face id or the Beyond Presence avatar id)" $key) }}
{{- end }}
{{- if and $f.gender (not (has $f.gender (list "female" "male"))) }}
{{- fail (printf "voiceAgent.%s[%s].gender is %q; use female or male, or set voice instead" $key $f.id $f.gender) }}
{{- end }}
{{- end }}
{{- end }}
{{- $providers := list "none" "openspline" "tavus" "bey" "simli" "hedra" }}
{{- if not (has .Values.voiceAgent.avatarProvider $providers) }}
{{- fail (printf "voiceAgent.avatarProvider is %q; use one of %s" .Values.voiceAgent.avatarProvider (join ", " $providers)) }}
{{- end }}
{{- range $p := .Values.voiceAgent.avatarProviders | default list }}
{{- if not (has (toString $p) $providers) }}
{{- fail (printf "voiceAgent.avatarProviders lists %q; use some of %s" (toString $p) (join ", " $providers)) }}
{{- end }}
{{- end }}
{{- $avatars := include "assistant.avatarProviders" . | fromJsonArray }}
{{- if has "openspline" $avatars }}
{{- if gt (len .Values.openspline.faces) 4 }}
{{- fail (printf "openspline.faces lists %d faces; the UI offers at most 4" (len .Values.openspline.faces)) }}
{{- end }}
{{- range $f := .Values.openspline.faces }}
{{- if not (regexMatch "^[A-Za-z0-9_-]+$" (toString $f.id)) }}
{{- fail (printf "openspline.faces: id %q must be letters, digits, - or _ (it names chart/files/portraits/<id>.jpg)" (toString $f.id)) }}
{{- end }}
{{- if not ($.Files.Get (printf "files/portraits/%s.jpg" $f.id)) }}
{{- fail (printf "openspline.faces: no portrait chart/files/portraits/%s.jpg for face %s" $f.id $f.id) }}
{{- end }}
{{- end }}
{{- end }}
{{- if has "openspline" $avatars }}
{{- $q := .Values.openspline.quality }}
{{- if not (has $q (list "low" "high")) }}
{{- fail (printf "openspline.quality is %q; use low (one GPU per session) or high (two)" $q) }}
{{- end }}
{{- $gpus := 1 }}
{{- range $k, $v := (dig "limits" (dict) .Values.openspline.resources) }}{{ if hasPrefix "nvidia.com/" $k }}{{ $gpus = int $v }}{{ end }}{{ end }}
{{- if and (eq $q "high") (lt $gpus 2) }}
{{- fail (printf "openspline.quality high needs two GPUs per voice session; openspline.resources has %d (set nvidia.com/gpu to 2, or quality low)" $gpus) }}
{{- end }}
{{- end }}
{{- if and .Values.ragApi.requestsRequireApproval (not .Values.integrations.slack.enabled) (not .Values.admin.enabled) }}
{{- fail "requests need an approval surface: enable Slack (integrations.slack.enabled) or the admin portal (admin.enabled), or set ragApi.requestsRequireApproval=false" }}
{{- end }}
