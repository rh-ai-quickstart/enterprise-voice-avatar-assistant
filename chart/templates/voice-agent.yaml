{{- if .Values.voiceAgent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-agent
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "voice-agent") | nindent 4 }}
spec:
  replicas: {{ .Values.voiceAgent.replicas }}
  selector:
    matchLabels:
      {{- include "assistant.selector" (dict "root" . "name" "voice-agent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "assistant.componentLabels" (dict "root" . "name" "voice-agent") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | trunc 16 }}
    spec:
      enableServiceLinks: false
      {{- include "assistant.affinity" $ | nindent 6 }}
      terminationGracePeriodSeconds: 60
      containers:
        - name: voice-agent
          image: {{ include "assistant.image" (dict "root" . "name" "voice-agent" "override" .Values.voiceAgent.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: assistant-config
            - secretRef:
                name: {{ .Values.secrets.models }}
            - secretRef:
                name: {{ .Values.secrets.livekit }}
            - secretRef:
                name: {{ .Values.secrets.integrations }}
                optional: true
          env:
            {{- range $k, $v := .Values.voiceAgent.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            - name: HOME
              value: /tmp
            - name: AGENT_PORT
              value: "8081"
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
          resources:
            {{- toYaml .Values.voiceAgent.resources | nindent 12 }}
          securityContext:
            {{- include "assistant.securityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq .Values.voiceAgent.avatarProvider "openspline" }}
            - name: portraits
              mountPath: /portraits
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq .Values.voiceAgent.avatarProvider "openspline" }}
        - name: portraits
          configMap:
            name: avatar-portraits
        {{- end }}
{{- end }}
