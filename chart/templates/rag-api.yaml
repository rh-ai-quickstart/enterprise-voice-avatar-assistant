{{- if .Values.ragApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "rag-api") | nindent 4 }}
spec:
  replicas: {{ .Values.ragApi.replicas }}
  selector:
    matchLabels:
      {{- include "assistant.selector" (dict "root" . "name" "rag-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "assistant.componentLabels" (dict "root" . "name" "rag-api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | trunc 16 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: rag-api
          image: {{ include "assistant.image" (dict "root" . "name" "rag-api" "override" .Values.ragApi.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: assistant-config
            - secretRef:
                name: {{ .Values.secrets.postgres }}
            - secretRef:
                name: {{ .Values.secrets.models }}
            - secretRef:
                name: {{ .Values.secrets.livekit }}
            - secretRef:
                name: {{ .Values.secrets.integrations }}
                optional: true
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.objectStore }}
                  key: S3_ACCESS_KEY
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.objectStore }}
                  key: S3_SECRET_KEY
            {{- if .Values.qdrant.apiKeySecret }}
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.qdrant.apiKeySecret }}
                  key: QDRANT_API_KEY
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.ragApi.resources | nindent 12 }}
          securityContext:
            {{- include "assistant.securityContext" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "rag-api") | nindent 4 }}
spec:
  selector:
    {{- include "assistant.selector" (dict "root" . "name" "rag-api") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
