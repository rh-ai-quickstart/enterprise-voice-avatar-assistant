[project]
name = "voice-agent"
version = "0.1.0"
description = "LiveKit Agents worker for the enterprise voice avatar assistant: Whisper STT, RAG API answers, Kokoro TTS, pluggable avatar"
requires-python = ">=3.12,<3.13"
dependencies = [
  "livekit-agents>=1.8.9,<2",
  "livekit-plugins-bey>=1.8.9,<2",
  "livekit-plugins-openai>=1.8.9,<2",
  "livekit-plugins-silero>=1.8.9,<2",
  "livekit-plugins-simli>=1.8.9,<2",
  "livekit-plugins-tavus>=1.8.9,<2",
  "openai>=1.50",
  "httpx>=0.27",
  "pydantic-settings>=2.5",
  "openspline>=0.1.1,<0.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
