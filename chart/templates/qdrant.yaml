{{- if .Values.qdrant.enabled }}
{{- $host := include "assistant.publicHost" (dict "root" . "name" "qdrant" "override" .Values.qdrant.publicHost) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-data
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "qdrant") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.global.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.qdrant.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "qdrant") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "assistant.selector" (dict "root" . "name" "qdrant") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "assistant.componentLabels" (dict "root" . "name" "qdrant") | nindent 8 }}
    spec:
      enableServiceLinks: false
      {{- include "assistant.affinity" $ | nindent 6 }}
      containers:
        - name: qdrant
          image: {{ .Values.qdrant.image }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: QDRANT__STORAGE__STORAGE_PATH
              value: /qdrant/storage
            - name: QDRANT__STORAGE__SNAPSHOTS_PATH
              value: /qdrant/snapshots
            - name: QDRANT__TELEMETRY_DISABLED
              value: "true"
            {{- if .Values.qdrant.apiKeySecret }}
            - name: QDRANT__SERVICE__API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.qdrant.apiKeySecret }}
                  key: QDRANT_API_KEY
            {{- end }}
          ports:
            - name: http
              containerPort: 6333
              protocol: TCP
            - name: grpc
              containerPort: 6334
              protocol: TCP
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.qdrant.resources | nindent 12 }}
          securityContext:
            {{- include "assistant.securityContext" . | nindent 12 }}
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
            - name: snapshots
              mountPath: /qdrant/snapshots
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: qdrant-data
        - name: snapshots
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "qdrant") | nindent 4 }}
spec:
  selector:
    {{- include "assistant.selector" (dict "root" . "name" "qdrant") | nindent 4 }}
  ports:
    - name: http
      port: 6333
      targetPort: http
    - name: grpc
      port: 6334
      targetPort: grpc
{{- if .Values.qdrant.route }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: qdrant
  labels:
    {{- include "assistant.componentLabels" (dict "root" . "name" "qdrant") | nindent 4 }}
spec:
  {{- if $host }}
  host: {{ $host }}
  {{- end }}
  to:
    kind: Service
    name: qdrant
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
{{- end }}
{{- end }}
