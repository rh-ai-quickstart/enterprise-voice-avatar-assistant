# Included in the http block of the UBI nginx image (/opt/app-root/etc/nginx.d).
#
# The public /api proxy forwards only what the chat UI, the voice panel and the admin portal call
# (docs/admin-portal.md); every other RAG API route needs the internal token and is answered here
# with 404. $uri is the normalised path (percent-decoding and dot segments resolved), the same one
# the RAG API receives. The entrypoint removes the lines marked admin-portal when ADMIN_ENABLED=false.
map "$request_method $uri" $api_public {
    default 0;
    "~^POST /api/v1/chat(/stream)?$" 1;
    "~^GET /api/v1/info$" 1;
    "~^GET /api/v1/voice/(token|faces)$" 1;
    "~^GET /api/v1/voice/faces/[^/]+/poster$" 1;
    "~^GET /api/v1/sessions/[^/]+/(messages|notifications)$" 1;
    "~^POST /api/v1/sessions/[^/]+/(notifications/ack|archive)$" 1;
    "~^DELETE /api/v1/sessions/[^/]+$" 1;
    "~^(GET|POST|PATCH|DELETE) /api/v1/admin/" 1;  # admin-portal
}

# The address the OpenShift router saw: the last X-Forwarded-For entry, which the router appended
# (the entries before it are whatever the client sent). The RAG API limits admin sign-ins by it.
map $http_x_forwarded_for $client_address {
    default $remote_addr;
    "~(?<last>[^,\s]+)\s*$" $last;
}
